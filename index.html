     SWIFTSCHOOL - REPORT CARDS MODULE
     ========================================================= -->

<section id="reportCardsSection" class="portal-section">

<style>
/* ================= REPORT CARD DASHBOARD ================= */

.report-card-container {
    padding: 20px;
}

.report-card-controls {
    background: #ffffff;
    padding: 20px;
    border-radius: 12px;
    margin-bottom: 20px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

.report-card-controls h2 {
    margin-top: 0;
}

.report-control-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 15px;
}

.report-control-grid label {
    display: block;
    font-weight: 600;
    margin-bottom: 6px;
}

.report-control-grid input,
.report-control-grid select {
    width: 100%;
    padding: 10px;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-size: 14px;
}

.report-buttons {
    margin-top: 18px;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
}

.report-buttons button {
    border: none;
    padding: 11px 18px;
    border-radius: 7px;
    cursor: pointer;
    font-weight: 600;
}

.generate-report-btn {
    background: #2563eb;
    color: white;
}

.print-report-btn {
    background: #16a34a;
    color: white;
}

.clear-report-btn {
    background: #64748b;
    color: white;
}

.report-buttons button:hover {
    opacity: 0.9;
}

/* ================= A4 REPORT ================= */

.report-paper {
    width: 210mm;
    min-height: 297mm;
    margin: 20px auto;
    background: white;
    padding: 12mm;
    box-sizing: border-box;
    color: #111827;
    font-family: Arial, Helvetica, sans-serif;
    box-shadow: 0 3px 15px rgba(0,0,0,0.15);
}

/* Header */

.report-header {
    text-align: center;
    border-bottom: 3px solid #1e3a8a;
    padding-bottom: 12px;
}

.school-logo {
    width: 75px;
    height: 75px;
    object-fit: contain;
    margin-bottom: 5px;
}

.school-name {
    font-size: 25px;
    font-weight: 800;
    text-transform: uppercase;
    color: #1e3a8a;
}

.school-address {
    font-size: 12px;
    margin-top: 4px;
}

.report-title {
    margin-top: 12px;
    font-size: 23px;
    font-weight: 800;
    letter-spacing: 2px;
    color: #111827;
}

/* Academic year */

.report-period {
    display: flex;
    justify-content: center;
    gap: 35px;
    margin-top: 8px;
    font-size: 13px;
}

/* Student information */

.student-info {
    margin-top: 18px;
    border: 1px solid #9ca3af;
}

.student-info-title {
    background: #1e3a8a;
    color: white;
    padding: 7px 10px;
    font-weight: bold;
    font-size: 13px;
}

.student-info-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
}

.student-info-item {
    padding: 8px 10px;
    border-right: 1px solid #d1d5db;
    border-bottom: 1px solid #d1d5db;
    min-height: 42px;
}

.student-info-item:nth-child(3n) {
    border-right: none;
}

.student-info-label {
    font-size: 10px;
    color: #6b7280;
    text-transform: uppercase;
    font-weight: bold;
}

.student-info-value {
    font-size: 13px;
    font-weight: 600;
    margin-top: 3px;
}

/* Results */

.results-title {
    margin-top: 18px;
    background: #1e3a8a;
    color: white;
    padding: 7px 10px;
    font-size: 13px;
    font-weight: bold;
}

.results-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 11px;
}

.results-table th {
    background: #e5e7eb;
    font-weight: 700;
    text-align: center;
    padding: 7px 4px;
    border: 1px solid #9ca3af;
}

.results-table td {
    padding: 7px 4px;
    border: 1px solid #9ca3af;
    text-align: center;
}

.results-table td:first-child {
    text-align: left;
    font-weight: 600;
}

/* Summary */

.summary-section {
    margin-top: 18px;
}

.summary-title {
    background: #1e3a8a;
    color: white;
    padding: 7px 10px;
    font-size: 13px;
    font-weight: bold;
}

.summary-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    border: 1px solid #9ca3af;
}

.summary-item {
    text-align: center;
    padding: 10px;
    border-right: 1px solid #9ca3af;
}

.summary-item:last-child {
    border-right: none;
}

.summary-label {
    font-size: 10px;
    color: #6b7280;
    font-weight: bold;
}

.summary-value {
    font-size: 17px;
    font-weight: 800;
    margin-top: 4px;
}

/* Attendance */

.attendance-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    border: 1px solid #9ca3af;
    margin-top: 8px;
}

.attendance-item {
    text-align: center;
    padding: 9px;
    border-right: 1px solid #9ca3af;
}

.attendance-item:last-child {
    border-right: none;
}

/* Comments */

.comments-section {
    margin-top: 18px;
}

.comment-box {
    border: 1px solid #9ca3af;
    padding: 10px;
    min-height: 45px;
    margin-top: 6px;
    font-size: 12px;
}

/* Signatures */

.signatures {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 50px;
    margin-top: 38px;
}

.signature-box {
    text-align: center;
}

.signature-line {
    border-top: 1px solid #111827;
    padding-top: 5px;
    font-size: 11px;
}

/* Footer */

.report-footer {
    margin-top: 25px;
    padding-top: 8px;
    border-top: 1px solid #9ca3af;
    text-align: center;
    font-size: 9px;
    color: #6b7280;
}

/* Empty state */

.report-empty {
    padding: 60px;
    text-align: center;
    color: #6b7280;
    background: white;
    border-radius: 10px;
}

/* Responsive */

@media (max-width: 800px) {

    .report-paper {
        width: 100%;
        min-height: auto;
        padding: 15px;
    }

    .student-info-grid {
        grid-template-columns: 1fr;
    }

    .student-info-item {
        border-right: none;
    }

    .summary-grid,
    .attendance-grid {
        grid-template-columns: repeat(2, 1fr);
    }

    .signatures {
        grid-template-columns: 1fr;
        gap: 30px;
    }
}

/* ================= PRINT ================= */

@media print {

    body * {
        visibility: hidden !important;
    }

    #reportCardsSection,
    #reportCardsSection * {
        visibility: visible !important;
    }

    #reportCardsSection {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
    }

    .report-card-controls {
        display: none !important;
    }

    .report-paper {
        width: 210mm;
        min-height: 297mm;
        margin: 0;
        padding: 12mm;
        box-shadow: none;
    }

    @page {
        size: A4 portrait;
        margin: 0;
    }
}
</style>


<div class="report-card-container">

    <!-- CONTROL PANEL -->

    <div class="report-card-controls">

        <h2>📄 Report Cards</h2>

        <p>
            Select a student and generate an official school report card.
        </p>

        <div class="report-control-grid">

            <div>
                <label>Student</label>
                <select id="reportStudentSelect">
                    <option value="">Select Student</option>
                </select>
            </div>

            <div>
                <label>Academic Year</label>
                <input
                    type="text"
                    id="reportAcademicYear"
                    value="2026/2027"
                    placeholder="2026/2027"
                >
            </div>

            <div>
                <label>Term</label>
                <select id="reportTerm">
                    <option value="First Term">First Term</option>
                    <option value="Second Term">Second Term</option>
                    <option value="Third Term">Third Term</option>
                </select>
            </div>

            <div>
                <label>Reopening Date</label>
                <input
                    type="date"
                    id="reportReopeningDate"
                >
            </div>

            <div>
                <label>Class Teacher Comment</label>
                <input
                    type="text"
                    id="reportTeacherComment"
                    placeholder="Enter teacher's comment"
                >
            </div>

            <div>
                <label>Headteacher Comment</label>
                <input
                    type="text"

                    placeholder="Enter headteacher's comment"
                >

        <div class="report-buttons">

            <button
                class="generate-report-btn"
                onclick="generateSwiftSchoolReport()"

                onclick="printSwiftSchoolReport()"
            >
                🖨 Print / Save PDF
            </button>

                class="clear-report-btn"
                onclick="clearSwiftSchoolReport()"
            >
                Clear
            </button>

        </div>

    </div>


    <!-- REPORT OUTPUT -->

    <div id="swiftSchoolReportOutput">

        <div class="report-empty">
            <h3>Report Card Preview</h3>
            <p>
                Select a student and click
                <strong>Generate Report</strong>
                to create the report card.
            </p>
        </div>

    </div>

</div>


<script>

/* =========================================================
   SWIFTSCHOOL REPORT CARD ENGINE
   ========================================================= */

(function () {

    /* ---------- STORAGE HELPERS ---------- */

    function getStudents() {

        try {

            return JSON.parse(
                localStorage.getItem("swiftSchoolStudents")
            ) || [];

        } catch (error) {

            return [];

        }

    }


    function getAttendance() {

        const possibleKeys = [
            "swiftSchoolAttendance",
            "swiftSchoolAttendances",
            "attendanceRecords"
        ];

        for (let key of possibleKeys) {

            try {

                const data = JSON.parse(
                    localStorage.getItem(key)
                );

                if (Array.isArray(data)) {
                    return data;
                }

            } catch (error) {}

        }

        return [];

    }


    /* ---------- SAFE TEXT ---------- */

    function safe(value) {

        if (
            value === undefined ||
            value === null ||
            value === ""
        ) {
            return "-";
        }

        return String(value)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");

    }


    /* ---------- FIND STUDENT NAME ---------- */

    function getStudentName(student) {

        return (
            student.name ||
            student.studentName ||
            (
                (student.firstName || "") +
                " " +
                (student.middleName || "") +
                " " +
                (student.lastName || "")
            ).trim() ||
            "Student"
        );

    }


    /* ---------- FIND STUDENT ID ---------- */

    function getStudentId(student) {

        return (
            student.id ||
            student.studentId ||
            student.studentID ||
            student.admissionNumber ||
            student.admissionNo ||
            "-"
        );

    }


    /* ---------- FIND CLASS ---------- */

    function getStudentClass(student) {

        return (
            student.className ||
            student.class ||
            student.grade ||
            student.level ||
            "-"
        );

    }


    /* ---------- LOAD STUDENTS ---------- */

    function loadReportStudents() {

        const select =
            document.getElementById(
                "reportStudentSelect"
            );

        if (!select) return;

        const students = getStudents();

        select.innerHTML =
            '<option value="">Select Student</option>';

        students.forEach(function (student, index) {

            const option =
                document.createElement("option");

            option.value = index;

            option.textContent =
                getStudentName(student) +
                " — " +
                getStudentClass(student);

            select.appendChild(option);

        });

    }


    /* ---------- GRADE SYSTEM ---------- */

    function getGrade(score) {

        score = Number(score) || 0;

        if (score >= 80) return "A";
        if (score >= 70) return "B";
        if (score >= 60) return "C";
        if (score >= 50) return "D";
        if (score >= 40) return "E";

        return "F";

    }


    function getInterpretation(score) {

        score = Number(score) || 0;

        if (score >= 80)
            return "Excellent";

        if (score >= 70)
            return "Very Good";

        if (score >= 60)
            return "Good";

        if (score >= 50)
            return "Satisfactory";

        if (score >= 40)
            return "Needs Improvement";

        return "Below Expectations";

    }


    /* ---------- GET SUBJECTS ---------- */

    function getSubjects(student) {

        let subjects = [];

        if (Array.isArray(student.subjects)) {

            subjects = student.subjects;

        } else if (Array.isArray(student.selectedSubjects)) {

            subjects = student.selectedSubjects;

        } else if (Array.isArray(student.enrolledSubjects)) {

            subjects = student.enrolledSubjects;

        }

        return subjects;

    }


    /* ---------- NORMALIZE SUBJECT ---------- */

    function normalizeSubject(subject) {

        if (typeof subject === "string") {

            return {
                name: subject,
                classScore: 0,
                examScore: 0,
                total: 0,
                position: "-"
            };

        }

        const classScore =
            Number(
                subject.classScore ??
                subject.class ??
                subject.ca ??
                subject.continuousAssessment ??
                0
            );

        const examScore =
            Number(
                subject.examScore ??
                subject.exam ??
                subject.examMark ??
                0
            );

        let total =
            Number(
                subject.total ??
                subject.totalScore
            );

        if (
            isNaN(total) ||
            total === 0
        ) {

            total =
                classScore +
                examScore;

        }

        return {

            name:
                subject.name ||
                subject.subjectName ||
                subject.title ||
                "Subject",

            classScore:
                classScore,

            examScore:
                examScore,

            total:
                total,

            position:
                subject.position ||
                subject.rank ||
                "-"

        };

    }


    /* ---------- ATTENDANCE ---------- */

    function calculateAttendance(student) {

        const records = getAttendance();

        let present = 0;
        let absent = 0;
        let late = 0;
        let excused = 0;

        const studentId =
            getStudentId(student);

        const studentName =
            getStudentName(student);

        records.forEach(function (record) {

            const recordStudentId =
                record.studentId ||
                record.studentID ||
                record.student_id;

            const recordStudentName =
                record.studentName ||
                record.name;

            const matchesId =
                recordStudentId &&
                String(recordStudentId) ===
                String(studentId);

            const matchesName =
                recordStudentName &&
                String(recordStudentName).toLowerCase() ===
                String(studentName).toLowerCase();

            if (
                !matchesId &&
                !matchesName
            ) {
                return;
            }

            const status =
                String(
                    record.status ||
                    ""
                ).toLowerCase();

            if (status === "present") {

                present++;

            } else if (status === "absent") {

                absent++;

            } else if (status === "late") {

                late++;

            } else if (status === "excused") {

                excused++;

            }

        });

        return {

            present,
            absent,
            late,
            excused,
            total:
                present +
                absent +
                late +
                excused

        };

    }


    /* ---------- GENERATE REPORT ---------- */

    window.generateSwiftSchoolReport =
    function () {

        const select =
            document.getElementById(
                "reportStudentSelect"
            );

        const students =
            getStudents();

        if (
            !select ||
            select.value === ""
        ) {

            alert(
                "Please select a student first."
            );

            return;

        }

        const student =
            students[
                Number(select.value)
            ];

        if (!student) {

            alert(
                "Student record could not be found."
            );

            return;

        }


        const academicYear =
            document.getElementById(
                "reportAcademicYear"
            ).value ||
            "2026/2027";

        const term =
            document.getElementById(
                "reportTerm"
            ).value ||
            "First Term";

        const reopeningDate =
            document.getElementById(
                "reportReopeningDate"
            ).value;

        const teacherComment =
            document.getElementById(
                "reportTeacherComment"
            ).value ||
            "Shows good effort and should continue to work hard.";

        const headComment =
            document.getElementById(
                "reportHeadComment"
            ).value ||
            "We congratulate the learner and encourage continued improvement.";


        const subjects =
            getSubjects(student)
            .map(normalizeSubject);


        /* ---------- CALCULATE SCORES ---------- */

        let overall =
            0;

        subjects.forEach(function (subject) {

            overall +=
                Number(subject.total) || 0;

        });


        const overallScore =
            subjects.length
                ? overall / subjects.length
                : 0;


        const grade =
            getGrade(overallScore);


        /* ---------- AGGREGATE ---------- */

        const aggregate =
            subjects.reduce(
                function (sum, subject) {

                    const score =
                        Number(subject.total) || 0;

                    let points = 5;

                    if (score >= 80)
                        points = 1;
                    else if (score >= 70)
                        points = 2;
                    else if (score >= 60)
                        points = 3;
                    else if (score >= 50)
                        points = 4;

                    return sum + points;

                },
                0
            );


        /* ---------- ATTENDANCE ---------- */

        const attendance =
            calculateAttendance(student);


        /* ---------- POSITION ---------- */

        const classPosition =
            student.position ||
            student.classPosition ||
            "-";


        /* ---------- ENROLLMENT ---------- */

        const classEnrollment =
            student.classEnrollment ||
            student.enrollment ||
            student.classSize ||
            "-";


        /* ---------- SCHOOL SETTINGS ---------- */

        const schoolName =
            localStorage.getItem(
                "swiftSchoolName"
            ) ||
            "SWIFTSCHOOL";

        const schoolAddress =
            localStorage.getItem(
                "swiftSchoolAddress"
            ) ||
            "School Address";

        const schoolPhone =
            localStorage.getItem(
                "swiftSchoolPhone"
            ) ||
            "Phone: __________________";

        const schoolEmail =
            localStorage.getItem(
                "swiftSchoolEmail"
            ) ||
            "Email: __________________";

        const schoolLogo =
            localStorage.getItem(
                "swiftSchoolLogo"
            );


        /* ---------- LOGO ---------- */

        const logoHTML =
            schoolLogo
                ? `
                    <img
                        src="${schoolLogo}"
                        class="school-logo"
                    >
                  `
                : `
                    <div
                        style="
                        font-size:50px;
                        margin-bottom:5px;
                        "
                    >
                        🏫
                    </div>
                  `;


        /* ---------- SUBJECT ROWS ---------- */

        let subjectRows = "";

        if (subjects.length === 0) {

            subjectRows = `
                <tr>
                    <td colspan="7">
                        No subject results have been entered yet.
                    </td>
                </tr>
            `;

        } else {

            subjects.forEach(function (subject) {

                subjectRows += `
                    <tr>

                        <td>
                            ${safe(subject.name)}
                        </td>

                        <td>
                            ${safe(subject.classScore)}
                        </td>

                        <td>
                            ${safe(subject.examScore)}
                        </td>

                        <td>
                            ${safe(subject.total)}
                        </td>

                        <td>
                            ${safe(subject.position)}
                        </td>

                        <td>
                            ${getGrade(subject.total)}
                        </td>

                        <td>
                            ${getInterpretation(subject.total)}
                        </td>

                    </tr>
                `;

            });

        }


        /* ---------- REPORT HTML ---------- */

        const reportHTML = `

        <div class="report-paper">

            <!-- HEADER -->

            <div class="report-header">

                ${logoHTML}

                <div class="school-name">
                    ${safe(schoolName)}
                </div>

                <div class="school-address">
                    ${safe(schoolAddress)}
                </div>

                <div class="school-address">
                    ${safe(schoolPhone)}
                    &nbsp;&nbsp;|&nbsp;&nbsp;
                    ${safe(schoolEmail)}
                </div>

                <div class="report-title">
                    REPORT CARD
                </div>

                <div class="report-period">

                    <span>
                        <strong>Academic Year:</strong>
                        ${safe(academicYear)}
                    </span>

                    <span>
                        <strong>Term:</strong>
                        ${safe(term)}
                    </span>

                </div>

            </div>


            <!-- STUDENT INFORMATION -->

            <div class="student-info">

                <div class="student-info-title">
                    STUDENT INFORMATION
                </div>

                <div class="student-info-grid">

                    <div class="student-info-item">

                        <div class="student-info-label">
                            Student Name
                        </div>

                        <div class="student-info-value">
                            ${safe(getStudentName(student))}
                        </div>

                    </div>


                    <div class="student-info-item">

                        <div class="student-info-label">
                            Student ID
                        </div>

                        <div class="student-info-value">
                            ${safe(getStudentId(student))}
                        </div>

                    </div>


                    <div class="student-info-item">

                        <div class="student-info-label">
                            Class
                        </div>

                        <div class="student-info-value">
                            ${safe(getStudentClass(student))}
                        </div>

                    </div>


                    <div class="student-info-item">

                        <div class="student-info-label">
                            Reopening Date
                        </div>

                        <div class="student-info-value">

                            ${
                                reopeningDate
                                ? new Date(
                                    reopeningDate
                                  ).toLocaleDateString()
                                : "-"
                            }

                        </div>

                    </div>


                    <div class="student-info-item">

                        <div class="student-info-label">
                            Class Position
                        </div>

                        <div class="student-info-value">
                            ${safe(classPosition)}
                        </div>

                    </div>


                    <div class="student-info-item">

                        <div class="student-info-label">
                            Class Enrollment
                        </div>

                        <div class="student-info-value">
                            ${safe(classEnrollment)}
                        </div>

                    </div>

                </div>

            </div>


            <!-- RESULTS -->

            <div class="results-title">
                ACADEMIC PERFORMANCE
            </div>

            <table class="results-table">

                <thead>

                    <tr>

                        <th>Subject</th>

                        <th>Class Score</th>

                        <th>Exam Score</th>

                        <th>Total Score</th>

                        <th>Position</th>

                        <th>Grade</th>

                        <th>Interpretation</th>

                    </tr>

                </thead>

                <tbody>

                    ${subjectRows}

                </tbody>

            </table>


            <!-- SUMMARY -->

            <div class="summary-section">

                <div class="summary-title">
                    ACADEMIC SUMMARY
                </div>

                <div class="summary-grid">

                    <div class="summary-item">

                        <div class="summary-label">
                            OVERALL SCORE
                        </div>

                        <div class="summary-value">
                            ${overallScore.toFixed(1)}%
                        </div>

                    </div>


                    <div class="summary-item">

                        <div class="summary-label">
                            GRADE
                        </div>

                        <div class="summary-value">
                            ${grade}
                        </div>

                    </div>


                    <div class="summary-item">

                        <div class="summary-label">
                            AGGREGATE
                        </div>

                        <div class="summary-value">
                            ${aggregate || "-"}
                        </div>

                    </div>


                    <div class="summary-item">

                        <div class="summary-label">
                            SUBJECTS
                        </div>

                        <div class="summary-value">
                            ${subjects.length}
                        </div>

                    </div>

                </div>

            </div>


            <!-- ATTENDANCE -->

            <div class="summary-section">

                <div class="summary-title">
                    ATTENDANCE RECORD
                </div>

                <div class="attendance-grid">

                    <div class="attendance-item">

                        <div class="summary-label">
                            PRESENT
                        </div>

                        <div class="summary-value">
                            ${attendance.present}
                        </div>

                    </div>


                    <div class="attendance-item">

                        <div class="summary-label">
                            ABSENT
                        </div>

                        <div class="summary-value">
                            ${attendance.absent}
                        </div>

                    </div>


                    <div class="attendance-item">

                        <div class="summary-label">
                            LATE
                        </div>

                        <div class="summary-value">
                            ${attendance.late}
                        </div>

                    </div>


                    <div class="attendance-item">

                        <div class="summary-label">
                            TOTAL RECORDS
                        </div>

                        <div class="summary-value">
                            ${attendance.total}
                        </div>

                    </div>

                </div>

            </div>


            <!-- COMMENTS -->

            <div class="comments-section">

                <div class="summary-title">
                    CLASS TEACHER'S COMMENT
                </div>

                <div class="comment-box">
                    ${safe(teacherComment)}
                </div>

            </div>


            <div class="comments-section">

                <div class="summary-title">
                    HEADTEACHER'S COMMENT
                </div>

                <div class="comment-box">
                    ${safe(headComment)}
                </div>

            </div>


            <!-- SIGNATURES -->

            <div class="signatures">

                <div class="signature-box">

                    <div style="height:35px;"></div>

                    <div class="signature-line">
                        Class Teacher's Signature
                    </div>

                </div>


                <div class="signature-box">

                    <div style="height:35px;"></div>

                    <div class="signature-line">
                        Headteacher's Signature
                    </div>

                </div>

            </div>


            <!-- FOOTER -->

            <div class="report-footer">

                Printed on:
                ${new Date().toLocaleDateString()}

                &nbsp;&nbsp; | &nbsp;&nbsp;

                ${safe(schoolName)}

                <br>

                This report card is an official academic record
                of the student.

            </div>

        </div>

        `;


        document.getElementById(
            "swiftSchoolReportOutput"
        ).innerHTML = reportHTML;

    };


    /* ---------- PRINT ---------- */

    window.printSwiftSchoolReport =
    function () {

        const report =
            document.querySelector(
                ".report-paper"
            );

        if (!report) {

            alert(
                "Please generate a report card first."
            );

            return;

        }

        window.print();

    };


    /* ---------- CLEAR ---------- */

    window.clearSwiftSchoolReport =
    function () {

        document.getElementById(
            "reportStudentSelect"
        ).value = "";

        document.getElementById(
            "reportTeacherComment"
        ).value = "";

        document.getElementById(
            "reportHeadComment"
        ).value = "";

        document.getElementById(
            "reportReopeningDate"
        ).value = "";

        document.getElementById(
            "swiftSchoolReportOutput"
        ).innerHTML = `

            <div class="report-empty">

                <h3>
                    Report Card Preview
                </h3>

                <p>
                    Select a student and click
                    <strong>
                        Generate Report
                    </strong>
                    to create the report card.
                </p>

            </div>

        `;

    };


    /* ---------- INITIALIZE ---------- */

    function initializeReportCards() {

        loadReportStudents();

    }


    if (
        document.readyState ===
        "loading"
    ) {

        document.addEventListener(
            "DOMContentLoaded",
            initializeReportCards
        );

    } else {

        initializeReportCards();

    }


    /* ---------- REFRESH WHEN NEEDED ---------- */

    window.refreshSwiftSchoolReports =
    function () {

        loadReportStudents();

    };

})();

</script>

</section>
