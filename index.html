<!-- =========================================================
     SWIFTSCHOOL - RESULTS / ASSESSMENT MODULE
     ========================================================= -->

<section id="resultsSection" class="portal-section">

<style>

/* ================= RESULTS MODULE ================= */

.results-container {
    padding: 20px;
}

.results-panel {
    background: #ffffff;
    padding: 20px;
    border-radius: 12px;
    margin-bottom: 20px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

.results-panel h2 {
    margin-top: 0;
}

.results-form-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 15px;
}

.results-form-group label {
    display: block;
    font-weight: 600;
    margin-bottom: 6px;
}

.results-form-group input,
.results-form-group select {
    width: 100%;
    padding: 10px;
    border: 1px solid #cbd5e1;
    border-radius: 6px;
    font-size: 14px;
}

.results-form-group input:focus,
.results-form-group select:focus {
    outline: none;
    border-color: #2563eb;
}

.result-total-display {
    background: #eff6ff;
    border: 1px solid #bfdbfe;
    padding: 10px;
    border-radius: 6px;
    font-weight: bold;
}

.result-grade-display {
    background: #f0fdf4;
    border: 1px solid #bbf7d0;
    padding: 10px;
    border-radius: 6px;
    font-weight: bold;
}

.results-buttons {
    margin-top: 18px;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
}

.results-buttons button {
    border: none;
    padding: 11px 18px;
    border-radius: 7px;
    cursor: pointer;
    font-weight: 600;
}

.save-result-btn {
    background: #2563eb;
    color: white;
}

.update-result-btn {
    background: #16a34a;
    color: white;
    display: none;
}

.clear-result-btn {
    background: #64748b;
    color: white;
}

.results-search {
    margin-bottom: 15px;
}

.results-search input {
    width: 100%;
    padding: 11px;
    border: 1px solid #cbd5e1;
    border-radius: 7px;
}

.results-table-wrapper {
    overflow-x: auto;
}

.results-data-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
}

.results-data-table th {
    background: #1e3a8a;
    color: white;
    padding: 10px 8px;
    text-align: center;
}

.results-data-table td {
    padding: 9px 8px;
    border-bottom: 1px solid #e5e7eb;
    text-align: center;
}

.results-data-table td:first-child {
    text-align: left;
}

.results-data-table tr:hover {
    background: #f8fafc;
}

.result-grade {
    font-weight: bold;
}

.result-actions {
    display: flex;
    justify-content: center;
    gap: 6px;
}

.result-actions button {
    border: none;
    padding: 6px 9px;
    border-radius: 5px;
    cursor: pointer;
    font-size: 12px;
}

.edit-result {
    background: #f59e0b;
    color: white;
}

.delete-result {
    background: #dc2626;
    color: white;
}

.no-results {
    text-align: center;
    padding: 30px;
    color: #64748b;
}

/* ================= MOBILE ================= */

@media (max-width: 700px) {

    .results-container {
        padding: 10px;
    }

    .results-panel {
        padding: 15px;
    }

}

</style>


<div class="results-container">

    <!-- ================= FORM ================= -->

    <div class="results-panel">

        <h2>📝 Results / Assessment</h2>

        <p>
            Enter and manage student academic results.
            Total, grade and interpretation are calculated automatically.
        </p>

        <div class="results-form-grid">

            <!-- Academic Year -->

            <div class="results-form-group">

                <label>
                    Academic Year
                </label>

                <input
                    type="text"
                    id="resultAcademicYear"
                    value="2026/2027"
                    placeholder="2026/2027"
                >

            </div>


            <!-- Term -->

            <div class="results-form-group">

                <label>
                    Term
                </label>

                <select id="resultTerm">

                    <option value="First Term">
                        First Term
                    </option>

                    <option value="Second Term">
                        Second Term
                    </option>

                    <option value="Third Term">
                        Third Term
                    </option>

                </select>

            </div>


            <!-- Class -->

            <div class="results-form-group">

                <label>
                    Class
                </label>

                <select
                    id="resultClass"
                    onchange="loadResultStudents()"
                >

                    <option value="">
                        Select Class
                    </option>

                </select>

            </div>


            <!-- Student -->

            <div class="results-form-group">

                <label>
                    Student
                </label>

                <select
                    id="resultStudent"
                    onchange="loadResultSubjects()"
                >

                    <option value="">
                        Select Student
                    </option>

                </select>

            </div>


            <!-- Subject -->

            <div class="results-form-group">

                <label>
                    Subject
                </label>

                <select id="resultSubject">

                    <option value="">
                        Select Subject
                    </option>

                </select>

            </div>


            <!-- Class Score -->

            <div class="results-form-group">

                <label>
                    Class Score
                </label>

                <input
                    type="number"
                    id="resultClassScore"
                    min="0"
                    max="50"
                    step="0.01"
                    placeholder="0 - 50"
                    oninput="calculateResultTotal()"
                >

            </div>


            <!-- Exam Score -->

            <div class="results-form-group">

                <label>
                    Exam Score
                </label>

                <input
                    type="number"
                    id="resultExamScore"
                    min="0"
                    max="50"
                    step="0.01"
                    placeholder="0 - 50"
                    oninput="calculateResultTotal()"
                >

            </div>


            <!-- Total -->

            <div class="results-form-group">

                <label>
                    Total Score
                </label>

                <div
                    class="result-total-display"
                    id="resultTotal"
                >
                    0
                </div>

            </div>


            <!-- Grade -->

            <div class="results-form-group">

                <label>
                    Grade
                </label>

                <div
                    class="result-grade-display"
                    id="resultGrade"
                >
                    -
                </div>

            </div>


            <!-- Interpretation -->

            <div class="results-form-group">

                <label>
                    Interpretation
                </label>

                <div
                    class="result-grade-display"
                    id="resultInterpretation"
                >
                    -
                </div>

            </div>

        </div>


        <div class="results-buttons">

            <button
                class="save-result-btn"
                id="saveResultBtn"
                onclick="saveSwiftSchoolResult()"
            >
                💾 Save Result
            </button>


            <button
                class="update-result-btn"
                id="updateResultBtn"
                onclick="updateSwiftSchoolResult()"
            >
                ✏️ Update Result
            </button>


            <button
                class="clear-result-btn"
                onclick="clearResultForm()"
            >
                Clear
            </button>

        </div>

    </div>


    <!-- ================= SAVED RESULTS ================= -->

    <div class="results-panel">

        <h2>📊 Saved Results</h2>

        <div class="results-search">

            <input
                type="text"
                id="resultsSearch"
                placeholder="Search by student, class or subject..."
                oninput="displaySwiftSchoolResults()"
            >

        </div>


        <div class="results-table-wrapper">

            <table class="results-data-table">

                <thead>

                    <tr>

                        <th>
                            Student
                        </th>

                        <th>
                            Class
                        </th>

                        <th>
                            Subject
                        </th>

                        <th>
                            Class Score
                        </th>

                        <th>
                            Exam Score
                        </th>

                        <th>
                            Total
                        </th>

                        <th>
                            Grade
                        </th>

                        <th>
                            Interpretation
                        </th>

                        <th>
                            Term
                        </th>

                        <th>
                            Actions
                        </th>

                    </tr>

                </thead>

                <tbody
                    id="resultsTableBody"
                >
                </tbody>

            </table>

        </div>

    </div>

</div>


<script>

/* =========================================================
   SWIFTSCHOOL RESULTS ENGINE
   ========================================================= */

(function () {

    let editingResultId = null;


    /* =====================================================
       STORAGE
       ===================================================== */

    function getStudents() {

        try {

            return JSON.parse(
                localStorage.getItem(
                    "swiftSchoolStudents"
                )
            ) || [];

        } catch (error) {

            return [];

        }

    }


    function getResults() {

        try {

            return JSON.parse(
                localStorage.getItem(
                    "swiftSchoolResults"
                )
            ) || [];

        } catch (error) {

            return [];

        }

    }


    function saveResults(results) {

        localStorage.setItem(
            "swiftSchoolResults",
            JSON.stringify(results)
        );

    }


    /* =====================================================
       STUDENT HELPERS
       ===================================================== */

    function getStudentName(student) {

        return (

            student.name ||

            student.studentName ||

            (
                (student.firstName || "") +
                " " +
                (student.middleName || "") +
                " " +
                (student.lastName || "")
            ).trim() ||

            "Student"

        );

    }


    function getStudentId(student) {

        return (

            student.id ||

            student.studentId ||

            student.studentID ||

            student.admissionNumber ||

            student.admissionNo ||

            ""

        );

    }


    function getStudentClass(student) {

        return (

            student.className ||

            student.class ||

            student.grade ||

            student.level ||

            ""

        );

    }


    /* =====================================================
       SUBJECT HELPERS
       ===================================================== */

    function getSubjects(student) {

        let subjects = [];


        if (
            Array.isArray(
                student.subjects
            )
        ) {

            subjects =
                student.subjects;

        }

        else if (
            Array.isArray(
                student.selectedSubjects
            )
        ) {

            subjects =
                student.selectedSubjects;

        }

        else if (
            Array.isArray(
                student.enrolledSubjects
            )
        ) {

            subjects =
                student.enrolledSubjects;

        }


        return subjects;

    }


    function getSubjectName(subject) {

        if (
            typeof subject ===
            "string"
        ) {

            return subject;

        }


        return (

            subject.name ||

            subject.subjectName ||

            subject.title ||

            ""

        );

    }


    /* =====================================================
       LOAD CLASSES
       ===================================================== */

    function loadResultClasses() {

        const classSelect =
            document.getElementById(
                "resultClass"
            );

        if (!classSelect) return;


        const students =
            getStudents();


        const classes = [];


        students.forEach(
            function (student) {

                const className =
                    getStudentClass(student);

                if (
                    className &&
                    !classes.includes(
                        className
                    )
                ) {

                    classes.push(
                        className
                    );

                }

            }
        );


        classSelect.innerHTML =
            '<option value="">Select Class</option>';


        classes.sort().forEach(
            function (className) {

                const option =
                    document.createElement(
                        "option"
                    );

                option.value =
                    className;

                option.textContent =
                    className;

                classSelect.appendChild(
                    option
                );

            }
        );

    }


    /* =====================================================
       LOAD STUDENTS
       ===================================================== */

    window.loadResultStudents =
    function () {

        const className =
            document.getElementById(
                "resultClass"
            ).value;


        const studentSelect =
            document.getElementById(
                "resultStudent"
            );


        studentSelect.innerHTML =
            '<option value="">Select Student</option>';


        if (!className) {

            return;

        }


        const students =
            getStudents();


        students.forEach(
            function (student, index) {

                if (
                    getStudentClass(
                        student
                    ) === className
                ) {

                    const option =
                        document.createElement(
                            "option"
                        );

                    option.value =
                        index;

                    option.textContent =
                        getStudentName(
                            student
                        );

                    studentSelect.appendChild(
                        option
                    );

                }

            }
        );


        loadResultSubjects();

    };


    /* =====================================================
       LOAD SUBJECTS
       ===================================================== */

    window.loadResultSubjects =
    function () {

        const studentSelect =
            document.getElementById(
                "resultStudent"
            );


        const subjectSelect =
            document.getElementById(
                "resultSubject"
            );


        subjectSelect.innerHTML =
            '<option value="">Select Subject</option>';


        if (
            !studentSelect.value
        ) {

            return;

        }


        const students =
            getStudents();


        const student =
            students[
                Number(
                    studentSelect.value
                )
            ];


        if (!student) return;


        const subjects =
            getSubjects(student);


        subjects.forEach(
            function (subject) {

                const subjectName =
                    getSubjectName(
                        subject
                    );


                if (!subjectName)
                    return;


                const option =
                    document.createElement(
                        "option"
                    );

                option.value =
                    subjectName;

                option.textContent =
                    subjectName;

                subjectSelect.appendChild(
                    option
                );

            }
        );

    };


    /* =====================================================
       GRADE
       ===================================================== */

    function getGrade(score) {

        score =
            Number(score) || 0;


        if (score >= 80)
            return "A";


        if (score >= 70)
            return "B";


        if (score >= 60)
            return "C";


        if (score >= 50)
            return "D";


        if (score >= 40)
            return "E";


        return "F";

    }


    /* =====================================================
       INTERPRETATION
       ===================================================== */

    function getInterpretation(score) {

        score =
            Number(score) || 0;


        if (score >= 80)
            return "Excellent";


        if (score >= 70)
            return "Very Good";


        if (score >= 60)
            return "Good";


        if (score >= 50)
            return "Satisfactory";


        if (score >= 40)
            return "Needs Improvement";


        return "Below Expectations";

    }


    /* =====================================================
       CALCULATE TOTAL
       ===================================================== */

    window.calculateResultTotal =
    function () {

        let classScore =
            Number(
                document.getElementById(
                    "resultClassScore"
                ).value
            ) || 0;


        let examScore =
            Number(
                document.getElementById(
                    "resultExamScore"
                ).value
            ) || 0;


        /* Limit values */

        if (classScore > 50) {

            classScore = 50;

            document.getElementById(
                "resultClassScore"
            ).value = 50;

        }


        if (examScore > 50) {

            examScore = 50;

            document.getElementById(
                "resultExamScore"
            ).value = 50;

        }


        if (classScore < 0)
            classScore = 0;


        if (examScore < 0)
            examScore = 0;


        const total =
            classScore +
            examScore;


        document.getElementById(
            "resultTotal"
        ).textContent =
            total.toFixed(2);


        document.getElementById(
            "resultGrade"
        ).textContent =
            getGrade(total);


        document.getElementById(
            "resultInterpretation"
        ).textContent =
            getInterpretation(total);

    };


    /* =====================================================
       SAVE RESULT
       ===================================================== */

    window.saveSwiftSchoolResult =
    function () {

        const academicYear =
            document.getElementById(
                "resultAcademicYear"
            ).value.trim();


        const term =
            document.getElementById(
                "resultTerm"
            ).value;


        const className =
            document.getElementById(
                "resultClass"
            ).value;


        const studentSelect =
            document.getElementById(
                "resultStudent"
            );


        const subject =
            document.getElementById(
                "resultSubject"
            ).value;


        const classScore =
            Number(
                document.getElementById(
                    "resultClassScore"
                ).value
            ) || 0;


        const examScore =
            Number(
                document.getElementById(
                    "resultExamScore"
                ).value
            ) || 0;


        /* Validation */

        if (!academicYear) {

            alert(
                "Please enter the academic year."
            );

            return;

        }


        if (!className) {

            alert(
                "Please select a class."
            );

            return;

        }


        if (!studentSelect.value) {

            alert(
                "Please select a student."
            );

            return;

        }


        if (!subject) {

            alert(
                "Please select a subject."
            );

            return;

        }


        if (
            classScore < 0 ||
            classScore > 50
        ) {

            alert(
                "Class Score must be between 0 and 50."
            );

            return;

        }


        if (
            examScore < 0 ||
            examScore > 50
        ) {

            alert(
                "Exam Score must be between 0 and 50."
            );

            return;

        }


        const students =
            getStudents();


        const student =
            students[
                Number(
                    studentSelect.value
                )
            ];


        if (!student) {

            alert(
                "Student record not found."
            );

            return;

        }


        const studentName =
            getStudentName(
                student
            );


        const studentId =
            getStudentId(
                student
            );


        const total =
            classScore +
            examScore;


        const results =
            getResults();


        /* Prevent duplicate */

        const duplicate =
            results.find(
                function (result) {

                    return (

                        result.studentId ===
                        studentId &&

                        result.subject ===
                        subject &&

                        result.academicYear ===
                        academicYear &&

                        result.term ===
                        term

                    );

                }
            );


        if (duplicate) {

            alert(
                "A result for this student, subject and term already exists. Use Edit to change it."
            );

            return;

        }


        const result = {

            id:
                Date.now().toString(),

            academicYear:
                academicYear,

            term:
                term,

            className:
                className,

            studentId:
                studentId,

            studentName:
                studentName,

            subject:
                subject,

            classScore:
                classScore,

            examScore:
                examScore,

            total:
                total,

            grade:
                getGrade(total),

            interpretation:
                getInterpretation(total),

            dateCreated:
                new Date().toISOString()

        };


        results.push(result);


        saveResults(results);


        alert(
            "Result saved successfully."
        );


        clearResultForm();


        displaySwiftSchoolResults();

    };


    /* =====================================================
       DISPLAY RESULTS
       ===================================================== */

    window.displaySwiftSchoolResults =
    function () {

        const tbody =
            document.getElementById(
                "resultsTableBody"
            );


        if (!tbody) return;


        const results =
            getResults();


        const search =
            (
                document.getElementById(
                    "resultsSearch"
                ).value || ""
            )
            .toLowerCase()
            .trim();


        let filtered =
            results.filter(
                function (result) {

                    const text = (

                        result.studentName +
                        " " +
                        result.className +
                        " " +
                        result.subject +
                        " " +
                        result.term

                    ).toLowerCase();


                    return text.includes(
                        search
                    );

                }
            );


        tbody.innerHTML = "";


        if (
            filtered.length === 0
        ) {

            tbody.innerHTML = `

                <tr>

                    <td
                        colspan="10"
                        class="no-results"
                    >

                        No results found.

                    </td>

                </tr>

            `;

            return;

        }


        filtered.forEach(
            function (result) {

                const row =
                    document.createElement(
                        "tr"
                    );


                row.innerHTML = `

                    <td>
                        ${escapeHTML(
                            result.studentName
                        )}
                    </td>

                    <td>
                        ${escapeHTML(
                            result.className
                        )}
                    </td>

                    <td>
                        ${escapeHTML(
                            result.subject
                        )}
                    </td>

                    <td>
                        ${Number(
                            result.classScore
                        ).toFixed(2)}
                    </td>

                    <td>
                        ${Number(
                            result.examScore
                        ).toFixed(2)}
                    </td>

                    <td>
                        <strong>
                            ${Number(
                                result.total
                            ).toFixed(2)}
                        </strong>
                    </td>

                    <td class="result-grade">
                        ${escapeHTML(
                            result.grade
                        )}
                    </td>

                    <td>
                        ${escapeHTML(
                            result.interpretation
                        )}
                    </td>

                    <td>
                        ${escapeHTML(
                            result.term
                        )}
                    </td>

                    <td>

                        <div
                            class="result-actions"
                        >

                            <button
                                class="edit-result"
                                onclick="editSwiftSchoolResult('${result.id}')"
                            >
                                Edit
                            </button>

                            <button
                                class="delete-result"
                                onclick="deleteSwiftSchoolResult('${result.id}')"
                            >
                                Delete
                            </button>

                        </div>

                    </td>

                `;


                tbody.appendChild(
                    row
                );

            }
        );

    };


    /* =====================================================
       EDIT RESULT
       ===================================================== */

    window.editSwiftSchoolResult =
    function (id) {

        const results =
            getResults();


        const result =
            results.find(
                function (item) {

                    return item.id === id;

                }
            );


        if (!result) {

            alert(
                "Result not found."
            );

            return;

        }


        document.getElementById(
            "resultAcademicYear"
        ).value =
            result.academicYear;


        document.getElementById(
            "resultTerm"
        ).value =
            result.term;


        const classSelect =
            document.getElementById(
                "resultClass"
            );


        classSelect.value =
            result.className;


        loadResultStudents();


        const students =
            getStudents();


        let studentIndex = -1;


        students.forEach(
            function (student, index) {

                if (
                    String(
                        getStudentId(student)
                    ) ===
                    String(
                        result.studentId
                    )
                ) {

                    studentIndex =
                        index;

                }

            }
        );


        const studentSelect =
            document.getElementById(
                "resultStudent"
            );


        if (studentIndex >= 0) {

            studentSelect.value =
                studentIndex;

        }


        loadResultSubjects();


        document.getElementById(
            "resultSubject"
        ).value =
            result.subject;


        document.getElementById(
            "resultClassScore"
        ).value =
            result.classScore;


        document.getElementById(
            "resultExamScore"
        ).value =
            result.examScore;


        calculateResultTotal();


        editingResultId =
            id;


        document.getElementById(
            "saveResultBtn"
        ).style.display =
            "none";


        document.getElementById(
            "updateResultBtn"
        ).style.display =
            "inline-block";


        const section =
            document.getElementById(
                "resultsSection"
            );


        if (section) {

            section.scrollIntoView({
                behavior: "smooth"
            });

        }

    };


    /* =====================================================
       UPDATE RESULT
       ===================================================== */

    window.updateSwiftSchoolResult =
    function () {

        if (!editingResultId) {

            return;

        }


        const results =
            getResults();


        const index =
            results.findIndex(
                function (result) {

                    return (
                        result.id ===
                        editingResultId
                    );

                }
            );


        if (index === -1) {

            alert(
                "Result could not be found."
            );

            return;

        }


        const academicYear =
            document.getElementById(
                "resultAcademicYear"
            ).value.trim();


        const term =
            document.getElementById(
                "resultTerm"
            ).value;


        const className =
            document.getElementById(
                "resultClass"
            ).value;


        const studentSelect =
            document.getElementById(
                "resultStudent"
            );


        const subject =
            document.getElementById(
                "resultSubject"
            ).value;


        const classScore =
            Number(
                document.getElementById(
                    "resultClassScore"
                ).value
            ) || 0;


        const examScore =
            Number(
                document.getElementById(
                    "resultExamScore"
                ).value
            ) || 0;


        if (
            !academicYear ||
            !className ||
            !studentSelect.value ||
            !subject
        ) {

            alert(
                "Please complete all required fields."
            );

            return;

        }


        if (
            classScore < 0 ||
            classScore > 50 ||
            examScore < 0 ||
            examScore > 50
        ) {

            alert(
                "Scores must be between 0 and 50."
            );

            return;

        }


        const students =
            getStudents();


        const student =
            students[
                Number(
                    studentSelect.value
                )
            ];


        const total =
            classScore +
            examScore;


        results[index] = {

            ...results[index],

            academicYear:
                academicYear,

            term:
                term,

            className:
                className,

            studentId:
                getStudentId(student),

            studentName:
                getStudentName(student),

            subject:
                subject,

            classScore:
                classScore,

            examScore:
                examScore,

            total:
                total,

            grade:
                getGrade(total),

            interpretation:
                getInterpretation(total),

            lastUpdated:
                new Date().toISOString()

        };


        saveResults(results);


        alert(
            "Result updated successfully."
        );


        clearResultForm();


        displaySwiftSchoolResults();

    };


    /* =====================================================
       DELETE RESULT
       ===================================================== */

    window.deleteSwiftSchoolResult =
    function (id) {

        const results =
            getResults();


        const result =
            results.find(
                function (item) {

                    return item.id === id;

                }
            );


        if (!result) return;


        const confirmed =
            confirm(
                "Delete the result for " +
                result.studentName +
                " — " +
                result.subject +
                "?"
            );


        if (!confirmed) {

            return;

        }


        const updated =
            results.filter(
                function (item) {

                    return item.id !== id;

                }
            );


        saveResults(updated);


        displaySwiftSchoolResults();

    };


    /* =====================================================
       CLEAR FORM
       ===================================================== */

    window.clearResultForm =
    function () {

        document.getElementById(
            "resultStudent"
        ).value = "";


        document.getElementById(
            "resultSubject"
        ).innerHTML =
            '<option value="">Select Subject</option>';


        document.getElementById(
            "resultClassScore"
        ).value = "";


        document.getElementById(
            "resultExamScore"
        ).value = "";


        document.getElementById(
            "resultTotal"
        ).textContent = "0";


        document.getElementById(
            "resultGrade"
        ).textContent = "-";


        document.getElementById(
            "resultInterpretation"
        ).textContent = "-";


        editingResultId = null;


        document.getElementById(
            "saveResultBtn"
        ).style.display =
            "inline-block";


        document.getElementById(
            "updateResultBtn"
        ).style.display =
            "none";

    };


    /* =====================================================
       ESCAPE HTML
       ===================================================== */

    function escapeHTML(value) {

        return String(
            value ?? ""
        )
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

    }


    /* =====================================================
       INITIALIZE
       ===================================================== */

    function initializeResults() {

        loadResultClasses();

        displaySwiftSchoolResults();

    }


    if (
        document.readyState ===
        "loading"
    ) {

        document.addEventListener(
            "DOMContentLoaded",
            initializeResults
        );

    } else {

        initializeResults();

    }


    /* =====================================================
       REFRESH FUNCTION
       ===================================================== */

    window.refreshSwiftSchoolResults =
    function () {

        loadResultClasses();

        displaySwiftSchoolResults();

    };

})();

</script>
