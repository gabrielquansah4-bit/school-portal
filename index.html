<!-- =========================================================
     SWIFTSCHOOL - RESULTS / ASSESSMENT MODULE
     ========================================================= -->

<section id="resultsSection" class="portal-section" style="display:none;">

<style>
.results-container{
    padding:20px;
}

.results-panel{
    background:#fff;
    padding:20px;
    border-radius:12px;
    margin-bottom:20px;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.results-panel h2{
    margin-top:0;
    color:#1e3a8a;
}

.results-form-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
    gap:15px;
}

.results-form-group label{
    display:block;
    font-weight:600;
    margin-bottom:6px;
}

.results-form-group input,
.results-form-group select{
    width:100%;
    padding:10px;
    border:1px solid #cbd5e1;
    border-radius:6px;
    font-size:14px;
}

.results-form-group input:focus,
.results-form-group select:focus{
    outline:none;
    border-color:#2563eb;
}

.result-total-display,
.result-grade-display{
    padding:10px;
    border-radius:6px;
    font-weight:bold;
}

.result-total-display{
    background:#eff6ff;
    border:1px solid #bfdbfe;
}

.result-grade-display{
    background:#f0fdf4;
    border:1px solid #bbf7d0;
}

.results-buttons{
    margin-top:18px;
    display:flex;
    gap:10px;
    flex-wrap:wrap;
}

.results-buttons button{
    border:none;
    padding:11px 18px;
    border-radius:7px;
    cursor:pointer;
    font-weight:600;
}

.save-result-btn{
    background:#2563eb;
    color:white;
}

.update-result-btn{
    background:#16a34a;
    color:white;
    display:none;
}

.clear-result-btn{
    background:#64748b;
    color:white;
}

.results-search{
    margin-bottom:15px;
}

.results-search input{
    width:100%;
    padding:11px;
    border:1px solid #cbd5e1;
    border-radius:7px;
}

.results-table-wrapper{
    overflow-x:auto;
}

.results-data-table{
    width:100%;
    border-collapse:collapse;
    font-size:13px;
}

.results-data-table th{
    background:#1e3a8a;
    color:white;
    padding:10px 8px;
    text-align:center;
}

.results-data-table td{
    padding:9px 8px;
    border-bottom:1px solid #e5e7eb;
    text-align:center;
}

.results-data-table td:first-child{
    text-align:left;
}

.results-data-table tr:hover{
    background:#f8fafc;
}

.result-grade{
    font-weight:bold;
}

.result-actions{
    display:flex;
    justify-content:center;
    gap:6px;
}

.result-actions button{
    border:none;
    padding:6px 9px;
    border-radius:5px;
    cursor:pointer;
    font-size:12px;
}

.edit-result{
    background:#f59e0b;
    color:white;
}

.delete-result{
    background:#dc2626;
    color:white;
}

.no-results{
    text-align:center;
    padding:30px;
    color:#64748b;
}

@media(max-width:700px){
    .results-container{
        padding:10px;
    }

    .results-panel{
        padding:15px;
    }
}
</style>

<div class="results-container">

    <div class="results-panel">

        <h2>📝 Results / Assessment</h2>

        <p>
            Enter and manage student academic results.
            Total, grade and interpretation are calculated automatically.
        </p>

        <div class="results-form-grid">

            <div class="results-form-group">
                <label>Academic Year</label>
                <input
                    type="text"
                    id="resultAcademicYear"
                    value="2026/2027"
                    placeholder="2026/2027"
                >
            </div>

            <div class="results-form-group">
                <label>Term</label>

                <select id="resultTerm">
                    <option value="First Term">First Term</option>
                    <option value="Second Term">Second Term</option>
                    <option value="Third Term">Third Term</option>
                </select>
            </div>

            <div class="results-form-group">
                <label>Class</label>

                <select id="resultClass">
                    <option value="">Select Class</option>
                </select>
            </div>

            <div class="results-form-group">
                <label>Student</label>

                <select id="resultStudent">
                    <option value="">Select Student</option>
                </select>
            </div>

            <div class="results-form-group">
                <label>Subject</label>

                <select id="resultSubject">
                    <option value="">Select Subject</option>
                </select>
            </div>

            <div class="results-form-group">
                <label>Class Score</label>

                <input
                    type="number"
                    id="resultClassScore"
                    min="0"
                    max="50"
                    step="0.01"
                    placeholder="0 - 50"
                >
            </div>

            <div class="results-form-group">
                <label>Exam Score</label>

                <input
                    type="number"
                    id="resultExamScore"
                    min="0"
                    max="50"
                    step="0.01"
                    placeholder="0 - 50"
                >
            </div>

            <div class="results-form-group">
                <label>Total Score</label>

                <div
                    class="result-total-display"
                    id="resultTotal"
                >
                    0.00
                </div>
            </div>

            <div class="results-form-group">
                <label>Grade</label>

                <div
                    class="result-grade-display"
                    id="resultGrade"
                >
                    -
                </div>
            </div>

            <div class="results-form-group">
                <label>Interpretation</label>

                <div
                    class="result-grade-display"
                    id="resultInterpretation"
                >
                    -
                </div>
            </div>

        </div>

        <div class="results-buttons">

            <button
                class="save-result-btn"
                id="saveResultBtn"
                type="button"
            >
                💾 Save Result
            </button>

            <button
                class="update-result-btn"
                id="updateResultBtn"
                type="button"
            >
                ✏️ Update Result
            </button>

            <button
                class="clear-result-btn"
                id="clearResultBtn"
                type="button"
            >
                Clear
            </button>

        </div>

    </div>


    <div class="results-panel">

        <h2>📊 Saved Results</h2>

        <div class="results-search">

            <input
                type="text"
                id="resultsSearch"
                placeholder="Search by student, class or subject..."
            >

        </div>

        <div class="results-table-wrapper">

            <table class="results-data-table">

                <thead>
                    <tr>
                        <th>Student</th>
                        <th>Class</th>
                        <th>Subject</th>
                        <th>Class Score</th>
                        <th>Exam Score</th>
                        <th>Total</th>
                        <th>Grade</th>
                        <th>Interpretation</th>
                        <th>Term</th>
                        <th>Actions</th>
                    </tr>
                </thead>

                <tbody id="resultsTableBody"></tbody>

            </table>

        </div>

    </div>

</div>

</section>


<!-- =========================================================
     SWIFTSCHOOL RESULTS JAVASCRIPT
     
     IMPORTANT:
     Put this script OUTSIDE any other <script> block.
     Ideally place it immediately before </body>.
     ========================================================= -->

<script>
(function(){

    let editingResultId = null;

    const STUDENT_KEY = "swiftSchoolStudents";
    const RESULT_KEY = "swiftSchoolResults";


    function getStudents(){

        try{
            return JSON.parse(
                localStorage.getItem(STUDENT_KEY)
            ) || [];
        }
        catch(error){
            return [];
        }

    }


    function getResults(){

        try{
            return JSON.parse(
                localStorage.getItem(RESULT_KEY)
            ) || [];
        }
        catch(error){
            return [];
        }

    }


    function saveResults(results){

        localStorage.setItem(
            RESULT_KEY,
            JSON.stringify(results)
        );

    }


    function studentName(student){

        if(!student) return "Student";

        if(student.name)
            return student.name;

        if(student.studentName)
            return student.studentName;

        return (
            (student.firstName || "") +
            " " +
            (student.middleName || "") +
            " " +
            (student.lastName || "")
        ).trim() || "Student";

    }


    function studentId(student){

        if(!student) return "";

        return String(
            student.id ||
            student.studentId ||
            student.studentID ||
            student.admissionNumber ||
            student.admissionNo ||
            ""
        );

    }


    function studentClass(student){

        if(!student) return "";

        return (
            student.className ||
            student.class ||
            student.grade ||
            student.level ||
            ""
        );

    }


    function getSubjects(student){

        if(!student) return [];

        if(Array.isArray(student.subjects))
            return student.subjects;

        if(Array.isArray(student.selectedSubjects))
            return student.selectedSubjects;

        if(Array.isArray(student.enrolledSubjects))
            return student.enrolledSubjects;

        return [];

    }


    function subjectName(subject){

        if(typeof subject === "string")
            return subject;

        if(!subject)
            return "";

        return (
            subject.name ||
            subject.subjectName ||
            subject.title ||
            ""
        );

    }


    function grade(score){

        score = Number(score) || 0;

        if(score >= 80) return "A";
        if(score >= 70) return "B";
        if(score >= 60) return "C";
        if(score >= 50) return "D";
        if(score >= 40) return "E";

        return "F";

    }


    function interpretation(score){

        score = Number(score) || 0;

        if(score >= 80) return "Excellent";
        if(score >= 70) return "Very Good";
        if(score >= 60) return "Good";
        if(score >= 50) return "Satisfactory";
        if(score >= 40) return "Needs Improvement";

        return "Below Expectations";

    }


    function escapeHTML(value){

        return String(value ?? "")
            .replace(/&/g,"&amp;")
            .replace(/</g,"&lt;")
            .replace(/>/g,"&gt;")
            .replace(/"/g,"&quot;")
            .replace(/'/g,"&#039;");

    }


    function calculate(){

        const classInput =
            document.getElementById("resultClassScore");

        const examInput =
            document.getElementById("resultExamScore");

        if(!classInput || !examInput)
            return;

        let classScore =
            Number(classInput.value) || 0;

        let examScore =
            Number(examInput.value) || 0;

        if(classScore > 50){
            classScore = 50;
            classInput.value = 50;
        }

        if(classScore < 0){
            classScore = 0;
            classInput.value = 0;
        }

        if(examScore > 50){
            examScore = 50;
            examInput.value = 50;
        }

        if(examScore < 0){
            examScore = 0;
            examInput.value = 0;
        }

        const total =
            classScore + examScore;

        document.getElementById("resultTotal")
            .textContent = total.toFixed(2);

        document.getElementById("resultGrade")
            .textContent = grade(total);

        document.getElementById("resultInterpretation")
            .textContent = interpretation(total);

    }


    function loadClasses(){

        const select =
            document.getElementById("resultClass");

        if(!select) return;

        const students = getStudents();

        const classes = [];

        students.forEach(function(student){

            const className =
                studentClass(student);

            if(
                className &&
                !classes.includes(className)
            ){
                classes.push(className);
            }

        });

        select.innerHTML =
            '<option value="">Select Class</option>';

        classes.sort().forEach(function(className){

            const option =
                document.createElement("option");

            option.value = className;
            option.textContent = className;

            select.appendChild(option);

        });

    }


    function loadStudents(){

        const className =
            document.getElementById("resultClass").value;

        const studentSelect =
            document.getElementById("resultStudent");

        const subjectSelect =
            document.getElementById("resultSubject");

        studentSelect.innerHTML =
            '<option value="">Select Student</option>';

        subjectSelect.innerHTML =
            '<option value="">Select Subject</option>';

        if(!className)
            return;

        const students = getStudents();

        students.forEach(function(student,index){

            if(
                studentClass(student) ===
                className
            ){

                const option =
                    document.createElement("option");

                option.value = index;

                option.textContent =
                    studentName(student);

                studentSelect.appendChild(option);

            }

        });

    }


    function loadSubjects(){

        const studentSelect =
            document.getElementById("resultStudent");

        const subjectSelect =
            document.getElementById("resultSubject");

        subjectSelect.innerHTML =
            '<option value="">Select Subject</option>';

        if(studentSelect.value === "")
            return;

        const students = getStudents();

        const student =
            students[
                Number(studentSelect.value)
            ];

        if(!student)
            return;

        const subjects =
            getSubjects(student);

        subjects.forEach(function(subject){

            const name =
                subjectName(subject);

            if(!name)
                return;

            const option =
                document.createElement("option");

            option.value = name;
            option.textContent = name;

            subjectSelect.appendChild(option);

        });

    }


    function clearForm(){

        document.getElementById("resultStudent")
            .value = "";

        document.getElementById("resultSubject")
            .innerHTML =
            '<option value="">Select Subject</option>';

        document.getElementById("resultClassScore")
            .value = "";

        document.getElementById("resultExamScore")
            .value = "";

        document.getElementById("resultTotal")
            .textContent = "0.00";

        document.getElementById("resultGrade")
            .textContent = "-";

        document.getElementById("resultInterpretation")
            .textContent = "-";

        editingResultId = null;

        document.getElementById("saveResultBtn")
            .style.display = "inline-block";

        document.getElementById("updateResultBtn")
            .style.display = "none";

    }


    function saveResult(){

        const academicYear =
            document.getElementById(
                "resultAcademicYear"
            ).value.trim();

        const term =
            document.getElementById(
                "resultTerm"
            ).value;

        const className =
            document.getElementById(
                "resultClass"
            ).value;

        const studentIndex =
            document.getElementById(
                "resultStudent"
            ).value;

        const subject =
            document.getElementById(
                "resultSubject"
            ).value;

        const classScore =
            Number(
                document.getElementById(
                    "resultClassScore"
                ).value
            ) || 0;

        const examScore =
            Number(
                document.getElementById(
                    "resultExamScore"
                ).value
            ) || 0;


        if(!academicYear){
            alert("Please enter the academic year.");
            return;
        }

        if(!className){
            alert("Please select a class.");
            return;
        }

        if(studentIndex === ""){
            alert("Please select a student.");
            return;
        }

        if(!subject){
            alert("Please select a subject.");
            return;
        }

        if(
            classScore < 0 ||
            classScore > 50 ||
            examScore < 0 ||
            examScore > 50
        ){
            alert(
                "Scores must be between 0 and 50."
            );
            return;
        }


        const students = getStudents();

        const student =
            students[Number(studentIndex)];

        if(!student){
            alert("Student record not found.");
            return;
        }


        const id =
            studentId(student);

        const results =
            getResults();


        const duplicate =
            results.find(function(result){

                return (
                    String(result.studentId) ===
                    String(id) &&

                    result.subject === subject &&

                    result.academicYear ===
                    academicYear &&

                    result.term === term
                );

            });


        if(duplicate){
            alert(
                "A result already exists for this student, subject and term. Use Edit to change it."
            );
            return;
        }


        const total =
            classScore + examScore;


        results.push({

            id: Date.now().toString(),

            academicYear:
                academicYear,

            term:
                term,

            className:
                className,

            studentId:
                id,

            studentName:
                studentName(student),

            subject:
                subject,

            classScore:
                classScore,

            examScore:
                examScore,

            total:
                total,

            grade:
                grade(total),

            interpretation:
                interpretation(total),

            dateCreated:
                new Date().toISOString()

        });


        saveResults(results);

        alert("Result saved successfully.");

        clearForm();

        displayResults();

    }


    function displayResults(){

        const tbody =
            document.getElementById(
                "resultsTableBody"
            );

        if(!tbody)
            return;

        const search =
            (
                document.getElementById(
                    "resultsSearch"
                ).value || ""
            )
            .toLowerCase()
            .trim();


        const results =
            getResults();


        const filtered =
            results.filter(function(result){

                const text =
                    (
                        result.studentName +
                        " " +
                        result.className +
                        " " +
                        result.subject +
                        " " +
                        result.term
                    ).toLowerCase();

                return text.includes(search);

            });


        tbody.innerHTML = "";


        if(filtered.length === 0){

            tbody.innerHTML = `
                <tr>
                    <td
                        colspan="10"
                        class="no-results"
                    >
                        No results found.
                    </td>
                </tr>
            `;

            return;

        }


        filtered.forEach(function(result){

            const row =
                document.createElement("tr");


            row.innerHTML = `

                <td>
                    ${escapeHTML(result.studentName)}
                </td>

                <td>
                    ${escapeHTML(result.className)}
                </td>

                <td>
                    ${escapeHTML(result.subject)}
                </td>

                <td>
                    ${Number(result.classScore).toFixed(2)}
                </td>

                <td>
                    ${Number(result.examScore).toFixed(2)}
                </td>

                <td>
                    <strong>
                        ${Number(result.total).toFixed(2)}
                    </strong>
                </td>

                <td class="result-grade">
                    ${escapeHTML(result.grade)}
                </td>

                <td>
                    ${escapeHTML(result.interpretation)}
                </td>

                <td>
                    ${escapeHTML(result.term)}
                </td>

                <td>

                    <div class="result-actions">

                        <button
                            type="button"
                            class="edit-result"
                            data-edit-id="${result.id}"
                        >
                            Edit
                        </button>

                        <button
                            type="button"
                            class="delete-result"
                            data-delete-id="${result.id}"
                        >
                            Delete
                        </button>

                    </div>

                </td>
            `;

            tbody.appendChild(row);

        });

    }


    function editResult(id){

        const results = getResults();

        const result =
            results.find(function(item){

                return item.id === id;

            });


        if(!result){
            alert("Result not found.");
            return;
        }


        document.getElementById(
            "resultAcademicYear"
        ).value =
            result.academicYear;


        document.getElementById(
            "resultTerm"
        ).value =
            result.term;


        document.getElementById(
            "resultClass"
        ).value =
            result.className;


        loadStudents();


        const students = getStudents();

        let index = -1;


        students.forEach(function(student,i){

            if(
                String(studentId(student)) ===
                String(result.studentId)
            ){
                index = i;
            }

        });


        if(index >= 0){

            document.getElementById(
                "resultStudent"
            ).value = index;

            loadSubjects();

        }


        document.getElementById(
            "resultSubject"
        ).value =
            result.subject;


        document.getElementById(
            "resultClassScore"
        ).value =
            result.classScore;


        document.getElementById(
            "resultExamScore"
        ).value =
            result.examScore;


        calculate();


        editingResultId = id;


        document.getElementById(
            "saveResultBtn"
        ).style.display =
            "none";


        document.getElementById(
            "updateResultBtn"
        ).style.display =
            "inline-block";

    }


    function updateResult(){

        if(!editingResultId)
            return;


        const results =
            getResults();


        const index =
            results.findIndex(function(result){

                return (
                    result.id ===
                    editingResultId
                );

            });


        if(index === -1){
            alert("Result could not be found.");
            return;
        }


        const academicYear =
            document.getElementById(
                "resultAcademicYear"
            ).value.trim();

        const term =
            document.getElementById(
                "resultTerm"
            ).value;

        const className =
            document.getElementById(
                "resultClass"
            ).value;

        const studentIndex =
            document.getElementById(
                "resultStudent"
            ).value;

        const subject =
            document.getElementById(
                "resultSubject"
            ).value;

        const classScore =
            Number(
                document.getElementById(
                    "resultClassScore"
                ).value
            ) || 0;

        const examScore =
            Number(
                document.getElementById(
                    "resultExamScore"
                ).value
            ) || 0;


        if(
            !academicYear ||
            !className ||
            studentIndex === "" ||
            !subject
        ){
            alert(
                "Please complete all required fields."
            );
            return;
        }


        if(
            classScore < 0 ||
            classScore > 50 ||
            examScore < 0 ||
            examScore > 50
        ){
            alert(
                "Scores must be between 0 and 50."
            );
            return;
        }


        const students = getStudents();

        const student =
            students[Number(studentIndex)];


        if(!student){
            alert("Student record not found.");
            return;
        }


        const total =
            classScore + examScore;


        results[index] = {

            ...results[index],

            academicYear:
                academicYear,

            term:
                term,

            className:
                className,

            studentId:
                studentId(student),

            studentName:
                studentName(student),

            subject:
                subject,

            classScore:
                classScore,

            examScore:
                examScore,

            total:
                total,

            grade:
                grade(total),

            interpretation:
                interpretation(total),

            lastUpdated:
                new Date().toISOString()

        };


        saveResults(results);

        alert("Result updated successfully.");

        clearForm();

        displayResults();

    }


    function deleteResult(id){

        const results =
            getResults();


        const result =
            results.find(function(item){

                return item.id === id;

            });


        if(!result)
            return;


        if(
            !confirm(
                "Delete the result for " +
                result.studentName +
                " — " +
                result.subject +
                "?"
            )
        ){
            return;
        }


        const updated =
            results.filter(function(item){

                return item.id !== id;

            });


        saveResults(updated);

        displayResults();

    }


    /* =====================================================
       EVENT LISTENERS
       ===================================================== */

    function initializeResults(){

        const classSelect =
            document.getElementById(
                "resultClass"
            );

        const studentSelect =
            document.getElementById(
                "resultStudent"
            );

        const classScore =
            document.getElementById(
                "resultClassScore"
            );

        const examScore =
            document.getElementById(
                "resultExamScore"
            );

        const saveButton =
            document.getElementById(
                "saveResultBtn"
            );

        const updateButton =
            document.getElementById(
                "updateResultBtn"
            );

        const clearButton =
            document.getElementById(
                "clearResultBtn"
            );

        const searchInput =
            document.getElementById(
                "resultsSearch"
            );


        if(!classSelect)
            return;


        loadClasses();

        displayResults();


        classSelect.addEventListener(
            "change",
            loadStudents
        );


        studentSelect.addEventListener(
            "change",
            loadSubjects
        );


        classScore.addEventListener(
            "input",
            calculate
        );


        examScore.addEventListener(
            "input",
            calculate
        );


        saveButton.addEventListener(
            "click",
            saveResult
        );


        updateButton.addEventListener(
            "click",
            updateResult
        );


        clearButton.addEventListener(
            "click",
            clearForm
        );


        searchInput.addEventListener(
            "input",
            displayResults
        );


        document
            .getElementById("resultsTableBody")
            .addEventListener(
                "click",
                function(event){

                    const editButton =
                        event.target.closest(
                            "[data-edit-id]"
                        );

                    const deleteButton =
                        event.target.closest(
                            "[data-delete-id]"
                        );


                    if(editButton){

                        editResult(
                            editButton
                                .dataset
                                .editId
                        );

                    }


                    if(deleteButton){

                        deleteResult(
                            deleteButton
                                .dataset
                                .deleteId
                        );

                    }

                }
            );

    }


    /* =====================================================
       PUBLIC REFRESH FUNCTION
       ===================================================== */

    window.refreshSwiftSchoolResults =
    function(){

        loadClasses();

        displayResults();

    };


    /* =====================================================
       START
       ===================================================== */

    if(
        document.readyState ===
        "loading"
    ){

        document.addEventListener(
            "DOMContentLoaded",
            initializeResults
        );

    }
    else{

        initializeResults();

    }

})();
</script>
